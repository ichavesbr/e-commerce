name: CI Backend

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.1

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.1

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Testes
        run: npm test
